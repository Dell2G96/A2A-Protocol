services:
  ollama:
    image: ollama/ollama:0.32.9
    container_name: a2a-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  app-2:
    build: .
    container_name: a2a-app2
    working_dir: /app
    volumes:
      - ./src:/app/src
    environment:
      OLLAMA_URL: http://ollama:11434
      POSTGRES_URL: postgresql://a2a:a2a@postgres:5432/a2a
      WORKER_URL: http://worker:8000
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:17
    container_name: a2a-postgres
    environment:
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a
      POSTGRES_DB: a2a
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    container_name : a2a-worker
    working_dir: /app
    volumes: 
      - ./src:/app/src
    environment:
      OLLAMA_URL: http://ollama:11434
      POSTGRES_URL: postgresql://a2a:a2a@postgres:5432/a2a    
    command: uvicorn worker:app --host 0.0.0.0 --port 8000 --app-dir src --reload --reload-dir src
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      
  
volumes:
  ollama-data:
  pg-data:

